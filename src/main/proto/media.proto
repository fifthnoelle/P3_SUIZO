syntax = "proto3";

package video;

option java_multiple_files = true;
option java_package = "com.suizo.video.grpc";
option java_outer_classname = "VideoServiceProto";

service VideoService{
  rpc UploadVideo(stream Video) returns (UploadSummary){}
}

message Video {
  string video_id = 1;
  bytes data = 2;
  int32 data_size = 3;
  bytes data_checksum = 4;
  string hash_algorithm = 5;
  int64 data_sequence = 6;
}

message UploadSummary {
  string status = 1;
  bytes final_file_checksum = 2;
}